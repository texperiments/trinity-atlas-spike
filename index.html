<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Atlas spike</title>
<style>
  html,body{margin:0;height:100%;background:#0B0C0E;color:#E9EAEC;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;left:10px;top:10px;right:10px;font-size:12px;line-height:1.5;
    background:rgba(11,12,14,.82);border:1px solid #22252A;border-radius:10px;padding:9px 11px;
    white-space:pre-wrap;pointer-events:none}
  #hudBtn{position:fixed;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(11,12,14,.82);
    color:#8A8F98;border:1px solid #22252A;font:inherit;font-size:15px;line-height:30px;text-align:center;padding:0}
  #hudBtn.on{color:#E9EAEC;border-color:#5A5F68}
  #hud[hidden]{display:none}
  #bottom{position:fixed;left:10px;right:10px;bottom:0;display:flex;flex-direction:column;gap:6px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  #pick{background:rgba(11,12,14,.92);border:1px solid #22252A;border-radius:12px;padding:11px 13px;font-size:13px;
    display:flex;align-items:center;gap:10px}
  #pickBody{flex:1;min-width:0}
  #pickName{font-size:15px;font-weight:600;color:#E9EAEC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pickName.idle{font-weight:400;color:#8A8F98}
  #pickSub{margin-top:2px;font-size:12px;color:#8A8F98;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pickSub[hidden]{display:none}
  #pickActions{display:flex;gap:6px;flex:none}
  #pickActions[hidden]{display:none}
  #pickActions button{background:transparent;color:#E9EAEC;border:1px solid #2C3037;border-radius:999px;padding:7px 12px;font:inherit;font-size:12px}
  #iso.on{background:#C8F135;color:#0B0C0E;border-color:#C8F135}
  #modelHint{display:flex;align-items:center;gap:10px;margin:4px 10px 8px;padding:9px 11px;border:1px dashed #2C3037;border-radius:10px;font-size:12px;color:#8A8F98}
  #modelHint[hidden]{display:none}
  #modelHint span{flex:1;min-width:0}
  #modelHint button{background:transparent;color:#C8F135;border:1px solid #2C3037;border-radius:999px;padding:5px 11px;font:inherit;font-size:12px}
  b{color:#C8F135;font-weight:600}
  .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .row button{background:rgba(11,12,14,.9);color:#E9EAEC;border:1px solid #22252A;border-radius:999px;padding:7px 12px;font:inherit;font-size:12px}

  #panel{background:rgba(11,12,14,.96);border:1px solid #22252A;border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;max-height:min(60vh,420px)}
  #panel[hidden]{display:none}
  #panelHead{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #22252A;font-size:13px}
  #panelHead button,#panelFoot button{background:transparent;color:#8A8F98;border:0;font:inherit;font-size:13px;padding:2px 4px}
  #presets{padding:9px 10px 4px}
  #presets button{background:rgba(11,12,14,.9);color:#8A8F98;border:1px solid #22252A;border-radius:999px;padding:6px 14px;font:inherit;font-size:12px}
  #presets button.on{background:#C8F135;color:#0B0C0E;border-color:#C8F135}
  #systemList{overflow-y:auto;padding:4px 4px 6px}
  .sysRow{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:#E9EAEC;
    font:inherit;font-size:13px;padding:9px 10px;border-radius:8px;text-align:left}
  .sysRow .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .sysRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sysRow .ct{color:#8A8F98;font-variant-numeric:tabular-nums}
  .sysRow .sw{width:34px;height:20px;border-radius:999px;background:#22252A;border:1px solid #2C3037;flex:none;position:relative}
  .sysRow .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#5A5F68}
  .sysRow.on{color:#E9EAEC}
  .sysRow.on .sw{background:#C8F135;border-color:#C8F135}
  .sysRow.on .sw::after{left:auto;right:2px;background:#0B0C0E}
  .sysRow:not(.on) .nm{color:#8A8F98}
  #panelFoot{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-top:1px solid #22252A;font-size:12px;color:#8A8F98}
  #panelBtn{color:#E9EAEC}
  #panelBtn.on{border-color:#5A5F68}
  #lines,#sets{background:rgba(11,12,14,.9);color:#E9EAEC;border:1px solid #22252A;border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;-webkit-appearance:none;appearance:none}
  #lines.on{color:#8DA2F0;border-color:#8DA2F0}
  #credit{padding:0 12px;font-size:10px;color:#8A8F98;text-align:center}
  #credit a{color:#8A8F98}
</style>
</head>
<body>
<div id="hud">loading three.js…</div>
<button id="hudBtn" hidden title="diagnostics">i</button>
<div id="bottom">
<div id="panel" hidden>
  <div id="panelHead"><span>Systems</span><button id="panelClose" title="close">✕</button></div>
  <div id="presets" class="row"><button data-preset="all">All</button><button data-preset="skeleton">Skeleton</button><button data-preset="organs">Organs</button></div>
  <div id="systemList"></div>
  <div id="modelHint" hidden><span id="modelHintText"></span><button id="modelSwitch">Switch</button></div>
  <div id="panelFoot"><span id="visibleCount"></span><button id="hideAll">Hide all</button></div>
</div>
<div id="layers" class="row">
  <button id="panelBtn">☰ Systems</button>
  <select id="sets"><option value="za">Model: joints, fascia &amp; muscles</option><option value="">Model: organs, vessels &amp; nerves</option><option value="za-lite">Model: joints &amp; fascia (light)</option></select>
  <select id="lines"><option value="">Myofascial lines…</option></select>
</div>
<div id="pick">
  <div id="pickBody"><div id="pickName">Tap a structure</div><div id="pickSub" hidden></div></div>
  <div id="pickActions" hidden><button id="iso">Isolate</button><button id="pickClear">Clear</button></div>
</div>
<div id="credit">Anatomy: <a href="https://github.com/Z-Anatomy" target="_blank">Z-Anatomy</a> (CC BY-SA 4.0), derived from <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/" target="_blank">BodyParts3D</a> (The Database Center for Life Science, CC BY 4.0). Adapted for the Trinity atlas spike.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
const Q = new URLSearchParams(location.search);
/**
 * BodyParts3D is what the bare URL loads (Toma, 2026-09-09: typing ?atlas= to reach it was the
 * fiddliest part of using this). It is the fuller set — vessels, nerves, organs — and the one
 * worth opening on. Z-Anatomy is still the set the app ships, and is one menu pick away at
 * ?atlas=za; it stays the reference for ligaments, menisci and discs, which BodyParts3D lacks.
 */
const SET = Q.get('atlas') || '';
const BASE = SET ? SET.replace(/\/?$/,'/') : '';
/**
 * One layer per anatomical system, named and coloured the way the human-atlas viewer does
 * (Toma, 2026-09-09). The colours are theirs, read from their bundle: red arteries, blue veins,
 * yellow nerves is the convention, and the rest of the palette is muted enough that fifteen
 * systems on one body still read apart.
 *
 * Z-Anatomy's four systems map onto the same slots, so both data sets use one table: its
 * `articular` is BodyParts3D's `connective`, and its `fascial` has no counterpart, so it borrows
 * the connective colour.
 */
const SYSTEMS = [
  { id: 'skeletal',      name: 'Skeleton',     color: '#E2D9BA', on: 1 },
  { id: 'muscular',      name: 'Muscles',      color: '#A85B50', on: 1 },
  { id: 'connective',    name: 'Joints',       color: '#AEC3BB', on: 1 },
  { id: 'articular',     name: 'Joints',       color: '#AEC3BB', on: 1, alias: 'connective' },
  { id: 'fascial',       name: 'Fascia',       color: '#C9BCB2', on: 0 },
  { id: 'arterial',      name: 'Arteries',     color: '#C05245', on: 0 },
  { id: 'venous',        name: 'Veins',        color: '#527C9F', on: 0 },
  { id: 'cardiac',       name: 'Heart',        color: '#B96760', on: 0 },
  { id: 'nervous',       name: 'Nerves',       color: '#D8B565', on: 0 },
  { id: 'sensory',       name: 'Senses',       color: '#B0C8CE', on: 0 },
  { id: 'respiratory',   name: 'Respiratory',  color: '#B98991', on: 0 },
  { id: 'digestive',     name: 'Digestive',    color: '#B8916B', on: 0 },
  { id: 'urinary',       name: 'Urinary',      color: '#B47961', on: 0 },
  { id: 'lymphatic',     name: 'Lymphatic',    color: '#879F7C', on: 0 },
  { id: 'endocrine',     name: 'Endocrine',    color: '#C5A09A', on: 0 },
  { id: 'reproductive',  name: 'Reproductive', color: '#BDA098', on: 0 },
  { id: 'integumentary', name: 'Body surface', color: '#BA9B7D', on: 0 },
];
// Slots are assigned per distinct layer; an alias shares its target's slot and button.
const SLOT = {}, SLOT_COLOR = [], SLOT_NAME = [], show = [];
for (const sysDef of SYSTEMS) {
  if (sysDef.alias !== undefined) { SLOT[sysDef.id] = SLOT[sysDef.alias]; continue; }
  SLOT[sysDef.id] = SLOT_COLOR.length;
  SLOT_COLOR.push(sysDef.color); SLOT_NAME.push(sysDef.name); show.push(sysDef.on);
}
const SLOT_COUNT = SLOT_COLOR.length;

const KEEP = new Set(Object.keys(SLOT));


// Myofascial lines after Thomas Myers: each is a list of name patterns tested against the structure
// name, so the same table serves Z-Anatomy (TA2 names) and BodyParts3D (FMA names). Sides are not
// distinguished; the spiral and functional lines cross the body and both sides light up.
const LINES = {
  'Superficial back line': [/plantar aponeurosis/, /flexor digitorum brevis/, /gastrocnemius/, /calcaneal tendon/, /biceps femoris/, /semitendinosus/, /semimembranosus/, /sacrotuberous/, /\biliocostalis/, /\blongissimus/, /\bspinalis/, /thoracolumbar fascia/, /epicranial aponeurosis/, /occipitalis/, /frontalis/],
  'Superficial front line': [/extensor digitorum longus/, /extensor hallucis longus/, /tibialis anterior/, /patellar ligament/, /rectus femoris/, /vastus/, /rectus abdominis/, /pyramidalis/, /sternocleidomastoid/],
  'Lateral line': [/fibularis longus/, /fibularis brevis/, /peroneus/, /iliotibial/, /tensor fasciae latae/, /gluteus maximus/, /gluteus medius/, /external (abdominal )?oblique/, /internal (abdominal )?oblique/, /intercostal/, /splenius capitis/, /sternocleidomastoid/],
  'Spiral line': [/splenius/, /rhomboid/, /serratus anterior/, /external (abdominal )?oblique/, /internal (abdominal )?oblique/, /tensor fasciae latae/, /iliotibial/, /tibialis anterior/, /fibularis longus/, /peroneus longus/, /biceps femoris/, /sacrotuberous/, /\biliocostalis/, /\blongissimus/, /\bspinalis/],
  'Functional lines': [/latissimus dorsi/, /thoracolumbar fascia/, /gluteus maximus/, /vastus lateralis/, /pectoralis major/, /rectus abdominis/, /adductor longus/, /sartorius/],
  'Deep front line': [/tibialis posterior/, /flexor digitorum longus/, /flexor hallucis longus/, /popliteus/, /adductor (magnus|longus|brevis|minimus)/, /pectineus/, /psoas/, /iliacus/, /quadratus lumborum/, /diaphragm/, /transversus thoracis/, /longus colli/, /longus capitis/, /scalenus|scalene/, /sternohyoid/, /sternothyroid/, /thyrohyoid/, /omohyoid/, /mylohyoid/, /geniohyoid/, /digastric/],
  'Arm lines, front': [/pectoralis major/, /latissimus dorsi/, /flexor carpi/, /flexor digitorum superficialis/, /flexor digitorum profundus/, /palmaris longus/, /pronator teres/, /flexor retinaculum of (the )?wrist/, /palmar aponeurosis/, /pectoralis minor/, /clavipectoral/, /biceps brachii/, /coracobrachialis/, /pollicis brevis/, /opponens pollicis/, /abductor pollicis brevis/],
  'Arm lines, back': [/trapezius/, /deltoid/, /lateral intermuscular septum of arm/, /extensor carpi/, /extensor digitorum(?! (longus|brevis))/, /extensor digiti minimi/, /extensor indicis/, /extensor pollicis/, /abductor pollicis longus/, /brachioradialis/, /rhomboid/, /levator scapulae/, /supraspinatus/, /infraspinatus/, /teres minor/, /subscapularis/, /triceps brachii/, /anconeus/, /digiti minimi of hand/],
};
// Bursae and tendon sheaths carry the muscle's name but are not the line.
const inLine = (k, p) => { const n = p.name.toLowerCase(); return !/bursa|sheath|meniscopatellar/.test(n) && LINES[k].some(r => r.test(n)); };
const lineOf = (p) => Object.keys(LINES).filter(k => inLine(k, p));
const linesEl = document.getElementById('lines');
for (const k of Object.keys(LINES)) { const o = document.createElement('option'); o.value = k; o.textContent = k; linesEl.appendChild(o); }
// Switching sets reloads the page: the buffers are rebuilt from scratch either way.
const pickNameEl = document.getElementById('pickName');
const pickSubEl = document.getElementById('pickSub');
const pickActionsEl = document.getElementById('pickActions');
const isoEl = document.getElementById('iso');
/**
 * The selection card. Toma could not find how to isolate a structure: the button was a small
 * word at the end of a diagnostics line. Now a tap puts the name in large type with Isolate and
 * Clear beside it, and the box counts and milliseconds live in the HUD where they belong.
 */
function setPick(name, sub) {
  if (!name) {
    pickNameEl.textContent = isolating() ? pickNameEl.textContent : 'Tap a structure';
    pickNameEl.classList.toggle('idle', !isolating());
    if (!isolating()) { pickSubEl.hidden = true; pickActionsEl.hidden = true; }
    return;
  }
  pickNameEl.textContent = name;
  pickNameEl.classList.remove('idle');
  pickSubEl.innerHTML = sub || '';
  pickSubEl.hidden = !sub;
  pickActionsEl.hidden = false;
}
document.getElementById('pickClear').onclick = () => {
  clearIsolate();
  if (typeof clearSelection === 'function') clearSelection();
  pickNameEl.textContent = 'Tap a structure';
  pickNameEl.classList.add('idle');
  pickSubEl.hidden = true;
  pickActionsEl.hidden = true;
};
let isoRef = null;                       // set once the uniform exists
let clearSelection = null;               // set once the selection uniform exists
let ghostSync = null;                    // set once the ghost mesh exists
const isolating = () => !!isoRef && isoRef.value > -0.5;
function clearIsolate() {
  if (isoRef) isoRef.value = -1;
  if (ghostSync) ghostSync();
  isoEl.classList.remove('on');
  isoEl.textContent = 'Isolate';
}

// BodyParts3D has no joint structures at all: its 'connective' system is forty fibrous odds and
// ends, retinacula and the linea alba mostly. Calling that 'Joints' promised what Z-Anatomy has
// and this set does not (Toma, 2026-09-09), so on this set the slot says what it holds.
const slotLabel = (i) => (SLOT_NAME[i] === 'Joints' && !SET ? 'Connective tissue' : SLOT_NAME[i]);
const layersEl = document.getElementById('layers');
const panelEl = document.getElementById('panel');
const panelBtn = document.getElementById('panelBtn');
const systemListEl = document.getElementById('systemList');
const visibleCountEl = document.getElementById('visibleCount');

/**
 * The systems live in a panel rather than a row of sixteen buttons, grouped by the three presets
 * the human-atlas viewer uses (Toma, 2026-09-09). Sixteen buttons wrapped onto four lines on a
 * phone and covered the model.
 */
const PRESETS = {
  all: () => SLOT_NAME.map(() => 1),
  skeleton: () => SLOT_NAME.map((_, i) => (['Skeleton', 'Joints'].includes(SLOT_NAME[i]) ? 1 : 0)),
  organs: () => SLOT_NAME.map((_, i) => (['Heart', 'Senses', 'Respiratory', 'Digestive', 'Urinary', 'Lymphatic', 'Endocrine', 'Reproductive'].includes(SLOT_NAME[i]) ? 1 : 0)),
};

panelBtn.onclick = () => {
  panelEl.hidden = !panelEl.hidden;
  panelBtn.classList.toggle('on', !panelEl.hidden);
};
document.getElementById('panelClose').onclick = () => { panelEl.hidden = true; panelBtn.classList.remove('on'); };

SLOT_NAME.forEach((name, i) => {
  const row = document.createElement('button');
  row.className = 'sysRow';
  row.dataset.layer = String(i);
  row.innerHTML = '<span class="dot"></span><span class="nm"></span><span class="ct"></span><span class="sw"></span>';
  row.querySelector('.dot').style.background = SLOT_COLOR[i];
  // BodyParts3D has no joint structures at all: its 'connective' system is forty fibrous odds and
  // ends, retinacula and the linea alba mostly. Calling that 'Joints' promised what Z-Anatomy has
  // and this set does not (Toma, 2026-09-09), so on this set the layer says what it holds.
  row.querySelector('.nm').textContent = slotLabel(SLOT_NAME.indexOf(name));
  systemListEl.appendChild(row);
});

const setsEl = document.getElementById('sets');
setsEl.value = SET;
setsEl.onchange = () => {
  const q = new URLSearchParams(location.search);
  if (setsEl.value) q.set('atlas', setsEl.value); else q.delete('atlas');
  location.search = q.toString();
};

const hud = document.getElementById('hud');
const pickEl = document.getElementById('pick');
const log = [];
function say(line){ log.push(line); hud.textContent = log.join('\n'); }
function mb(n){ return (n/1048576).toFixed(1)+' MB'; }
const t0 = performance.now();
const since = () => ((performance.now()-t0)/1000).toFixed(1)+'s';

async function gunzip(res){
  // Some hosts add Content-Encoding for .gz files, so the browser may already have inflated it.
  const raw = await res.arrayBuffer();
  const b = new Uint8Array(raw);
  if (!(b[0] === 0x1f && b[1] === 0x8b)) return raw;
  if (typeof DecompressionStream === 'undefined') throw new Error('no DecompressionStream');
  return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}

async function main(){
  if (typeof THREE === 'undefined') { say('three.js failed to load'); return; }
  say('three ' + THREE.REVISION + ' — fetching atlas.json…');

  const atlas = await (await fetch(BASE+'atlas.json')).json();
  const parts = atlas.parts.filter(p => KEEP.has(p.system));

  // Sizes are known up front, so chunks are decoded one at a time and released.
  // Peak memory is one decompressed chunk plus the merged buffers, not all twelve.
  let nv = 0, ni = 0;
  for (const p of parts) { nv += p.vertexCount; ni += p.indexCount; }
  const pos = new Float32Array(nv*3), nor = new Int16Array(nv*3),
        idx = new Uint32Array(ni), pid = new Float32Array(nv), sid = new Float32Array(nv), tint = new Uint8Array(nv);
  const bytes = pos.byteLength + nor.byteLength + idx.byteLength + pid.byteLength + sid.byteLength + tint.byteLength;
  const vstart = new Uint32Array(parts.length); // first vertex of each part, for re-tinting
  say(`parts ${parts.length} · verts ${nv.toLocaleString()} · tris ${(ni/3).toLocaleString()} · buffers ${mb(bytes)}`);

  const byChunk = new Map();
  parts.forEach((p,i) => { if(!byChunk.has(p.chunk)) byChunk.set(p.chunk,[]); byChunk.get(p.chunk).push([p,i]); });
  const chunks = [...byChunk.keys()].sort((a,b)=>a-b);

  const ranges = new Uint32Array(parts.length+1); // first triangle of each part, for picking
  let vo = 0, io = 0, downloaded = 0;

  for (const c of chunks){
    const url = BASE+'models/body-'+c+'.bin.gz';
    const res = await fetch(url);
    const buf = await gunzip(res);
    downloaded += buf.byteLength;
    for (const [p,i] of byChunk.get(c)){
      pos.set(new Float32Array(buf, p.positions, p.vertexCount*3), vo*3);
      nor.set(new Int16Array(buf, p.normals, p.vertexCount*3), vo*3);
      const src = new Uint32Array(buf, p.indices, p.indexCount);
      for (let k=0;k<p.indexCount;k++) idx[io+k] = src[k] + vo;
      pid.fill(i, vo, vo+p.vertexCount);
      sid.fill(SLOT[p.system], vo, vo+p.vertexCount);
      vstart[i] = vo;
      ranges[i] = io/3;
      vo += p.vertexCount; io += p.indexCount;
    }
    say(`chunk ${c} done (${chunks.indexOf(c)+1}/${chunks.length}) · ${mb(downloaded)} decoded · ${since()}`);
    await new Promise(r=>setTimeout(r,0)); // let the browser reclaim the chunk
  }
  ranges[parts.length] = io/3;
  // parts were written in chunk order, so the triangle ranges need sorting for the binary search
  const order = parts.map((_,i)=>i).sort((a,b)=>ranges[a]-ranges[b]);
  const starts = order.map(i=>ranges[i]);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3,true));
  g.setAttribute('partIndex', new THREE.BufferAttribute(pid,1));
  g.setAttribute('sysSlot', new THREE.BufferAttribute(sid,1));
  const tintAttr = new THREE.BufferAttribute(tint,1,true);
  g.setAttribute('lineTint', tintAttr);
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();

  const mat = new THREE.MeshLambertMaterial({ color:0xC9BCB2, side:THREE.DoubleSide });
  const uSel = { value: -1 };
  const uIso = { value: -1 };   // >= 0 shows that one part and nothing else
  isoRef = uIso;
  isoEl.onclick = () => {
    if (uIso.value > -0.5) { clearIsolate(); return; }
    if (uSel.value < 0) return;
    uIso.value = uSel.value;
    syncGhost();
    isoEl.classList.add('on');
    isoEl.textContent = 'Show surroundings';
  };
  clearSelection = () => { uSel.value = -1; };
  // Two vec4s rather than an array: a dynamically indexed array needs WebGL2, and the phone this
  // spike exists to measure is exactly where that assumption would break.
  // A uniform array read only at literal indices: a dynamically indexed one needs WebGL2, and a
  // phone is exactly where that assumption breaks. The chain below is generated for that reason.
  const uShow = { value: Float32Array.from(show) };
  const slotChain = (expr) => {
    let out = expr + '[' + (SLOT_COUNT - 1) + ']';
    for (let i = SLOT_COUNT - 2; i >= 0; i--) out = 'vS < ' + (i + 0.5) + ' ? ' + expr + '[' + i + '] : ' + out;
    return out;
  };
  const uCol = { value: SLOT_COLOR.map(h => new THREE.Color(h)) };
  const uLine = { value: 0 };
  mat.onBeforeCompile = (s) => {
    s.uniforms.uSel = uSel; s.uniforms.uIso = uIso; s.uniforms.uShow = uShow; s.uniforms.uLine = uLine; s.uniforms.uCol = uCol;
    s.vertexShader = 'attribute float partIndex;\nattribute float sysSlot;\nattribute float lineTint;\nvarying float vP;\nvarying float vS;\nvarying float vT;\n' +
      s.vertexShader.replace('void main() {', 'void main() {\n vP = partIndex; vS = sysSlot; vT = lineTint;');
    s.fragmentShader = 'uniform float uSel;\nuniform float uIso;\nuniform float uShow[' + SLOT_COUNT + '];\nuniform float uLine;\nuniform vec3 uCol[' + SLOT_COUNT + '];\nvarying float vP;\nvarying float vS;\nvarying float vT;\n' +
      s.fragmentShader
        .replace('void main() {',
          'void main() {\n float sh = ' + slotChain('uShow') + ';\n if (sh < 0.5) discard;\n' +
          // One structure alone, when it is being inspected. Isolation beats every layer switch.
          ' if (uIso > -0.5 && abs(vP - uIso) > 0.5) discard;')
        .replace('#include <color_fragment>',
          '#include <color_fragment>\n diffuseColor.rgb = ' + slotChain('uCol') + ';')
        .replace('#include <dithering_fragment>',
          '#include <dithering_fragment>\n if (uLine > 0.5 && vT < 0.5 && vS > 0.5) discard; if (uLine > 0.5) gl_FragColor.rgb = vT > 0.5 ? mix(gl_FragColor.rgb, vec3(0.42,0.52,0.90), 0.8) : gl_FragColor.rgb * 0.55;\n if (abs(vP-uSel) < 0.5) gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.784,0.945,0.208), 0.75);');
  };
  linesEl.onchange = () => {
    const k = linesEl.value;
    uLine.value = k ? 1 : 0; linesEl.classList.toggle('on', !!k);
    tint.fill(0);
    let n = 0;
    if (k) for (let i=0;i<parts.length;i++) if (inLine(k, parts[i])) { tint.fill(255, vstart[i], vstart[i]+parts[i].vertexCount); n++; }
    tintAttr.needsUpdate = true;
    uSel.value = -1;
    if (k) setPick(k, n + ' structures, shown over the skeleton'); else setPick(null);
  };
  /**
   * The parts each system holds, counted once. The panel shows them because "Arteries 639" is the
   * quickest way to know whether a layer is worth switching on.
   */
  const perSlot = new Array(SLOT_COUNT).fill(0);
  for (const p of parts) perSlot[SLOT[p.system]]++;

  function applyLayers() {
    uShow.value.set(show);
    for (const row of systemListEl.querySelectorAll('.sysRow')) {
      const k = +row.dataset.layer;
      row.classList.toggle('on', !!show[k]);
      row.querySelector('.ct').textContent = perSlot[k] || '';
      // A system this model does not carry is not offered: a switch that shows nothing is a bug
      // to whoever flips it (Toma turned on Heart and saw "0 pieces visible", 2026-09-09).
      row.hidden = !perSlot[k];
    }
    // A preset is lit only while the layers still match it exactly.
    for (const b of document.querySelectorAll('#presets button')) {
      const want = PRESETS[b.dataset.preset]();
      b.classList.toggle('on', want.every((v, i) => !!v === !!show[i]));
    }
    syncGhost();
    const shown = parts.filter(p => show[SLOT[p.system]]).length;
    visibleCountEl.textContent = shown + (shown === 1 ? ' piece visible' : ' pieces visible');
    if (uSel.value >= 0 && !show[SLOT[parts[uSel.value].system]]) { uSel.value = -1; clearIsolate(); setPick(null); }
    hudLine();
  }

  for (const row of systemListEl.querySelectorAll('.sysRow')) {
    row.onclick = () => { const k = +row.dataset.layer; show[k] = show[k] ? 0 : 1; applyLayers(); };
  }
  for (const b of document.querySelectorAll('#presets button')) {
    b.onclick = () => { PRESETS[b.dataset.preset]().forEach((v, i) => { show[i] = v; }); applyLayers(); };
  }
  document.getElementById('hideAll').onclick = () => { show.fill(0); applyLayers(); };

  // What the other model has that this one does not, and the way there.
  {
    const hint = document.getElementById('modelHint');
    const text = document.getElementById('modelHintText');
    const sw = document.getElementById('modelSwitch');
    if (SET) { text.textContent = 'Heart, arteries, veins, nerves and organs are in the other model.'; sw.onclick = () => { setsEl.value = ''; setsEl.onchange(); }; }
    else { text.textContent = 'Joint ligaments, menisci, discs and fascia are in the other model.'; sw.onclick = () => { setsEl.value = 'za'; setsEl.onchange(); }; }
    hint.hidden = false;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0B0C0E);
  const mesh = new THREE.Mesh(g, mat);
  scene.add(mesh);

  /**
   * The body surface as a ghost. The human-atlas viewer draws a faint skin around whatever is
   * shown, and it is most of why theirs reads as a whole body when only muscles are on (Toma,
   * 2026-09-09). Same vertices, only the skin parts' triangles, drawn after everything at low
   * opacity without writing depth. It shows whenever the solid skin layer is off, and only the
   * organs model has a skin to draw.
   */
  let ghost = null;
  {
    const skinSlot = SLOT.integumentary;
    const skinParts = skinSlot === undefined ? [] : parts.map((p, i) => [p, i]).filter(([p]) => SLOT[p.system] === skinSlot);
    if (skinParts.length) {
      let n = 0; for (const [p] of skinParts) n += p.indexCount;
      const sub = new Uint32Array(n); let o = 0;
      for (const [p, i] of skinParts) { sub.set(idx.subarray(ranges[i]*3, ranges[i]*3 + p.indexCount), o); o += p.indexCount; }
      const gg = new THREE.BufferGeometry();
      gg.setAttribute('position', g.getAttribute('position'));
      gg.setAttribute('normal', g.getAttribute('normal'));
      gg.setIndex(new THREE.BufferAttribute(sub, 1));
      const gm = new THREE.MeshLambertMaterial({ color: 0xD9CFC2, transparent: true, opacity: 0.13, depthWrite: false, side: THREE.FrontSide });
      ghost = new THREE.Mesh(gg, gm);
      ghost.renderOrder = 10;
      scene.add(ghost);
    }
  }
  const syncGhost = () => { if (ghost) ghost.visible = !show[SLOT.integumentary] && !isolating(); };
  ghostSync = syncGhost;
  // Three lights rather than one: a sky-and-ground fill, a key from front-above and a soft rim from
  // behind, so a rib cage reads as round instead of flat. Tone mapping keeps the reds from clipping.
  scene.add(new THREE.HemisphereLight(0xF2F4F8, 0x2A2D33, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(1.2, 2.2, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0xB9C4D6, 0.35); rim.position.set(-2, 1.5, -3); scene.add(rim);

  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const cam = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.05, 20);
  const target = new THREE.Vector3(0, 0.95, 0);
  let theta = 0, phi = Math.PI/2, dist = 2.6;
  const place = () => {
    cam.position.set(
      target.x + dist*Math.sin(phi)*Math.sin(theta),
      target.y + dist*Math.cos(phi),
      target.z + dist*Math.sin(phi)*Math.cos(theta));
    cam.lookAt(target);
  };
  place();
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  });

  // --- minimal orbit: drag to rotate, pinch/wheel to zoom, tap to pick ---
  const pts = new Map(); let last = null, pinch0 = 0, moved = 0, downAt = 0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX,y:e.clientY});
    last = {x:e.clientX,y:e.clientY}; moved = 0; downAt = performance.now();
    if (pts.size === 2) pinch0 = spread();
  });
  const spread = () => { const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if (pts.size === 2){ const s = spread(); if (pinch0) dist = clamp(dist*pinch0/s); pinch0 = s; place(); return; }
    const dx = e.clientX-last.x, dy = e.clientY-last.y;
    moved += Math.abs(dx)+Math.abs(dy); last = {x:e.clientX,y:e.clientY};
    theta -= dx*0.006; phi = Math.max(0.15, Math.min(Math.PI-0.15, phi - dy*0.006));
    place();
  });
  const up = e => {
    pts.delete(e.pointerId); pinch0 = 0;
    if (moved < 8 && performance.now()-downAt < 500) pick(e.clientX, e.clientY);
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', e=>pts.delete(e.pointerId));
  el.addEventListener('wheel', e => { e.preventDefault(); dist = clamp(dist*(1+e.deltaY*0.001)); place(); }, {passive:false});
  const clamp = d => Math.max(0.35, Math.min(6, d));

  // Picking one structure out of a million triangles. Brute force costs ~350 ms a tap, so the
  // per-part bounds already in atlas.json act as the broad phase: the ray meets a few dozen boxes,
  // and drawRange limits the triangle test to one part at a time.
  const ray = new THREE.Raycaster();
  const boxes = parts.map(p => new THREE.Box3(
    new THREE.Vector3(p.bounds[0][0], p.bounds[0][1], p.bounds[0][2]),
    new THREE.Vector3(p.bounds[1][0], p.bounds[1][1], p.bounds[1][2])));
  function pick(x,y){
    const t = performance.now();
    ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1, -(y/innerHeight)*2+1), cam);
    const cand = [];
    // With a line selected only its members and the bones are drawn, so only those can be hit.
    const lineK = linesEl.value;
    for (let i=0;i<parts.length;i++) {
      if (uIso.value > -0.5) { if (i !== uIso.value) continue; }
      else if (!show[SLOT[parts[i].system]] || (lineK && SLOT[parts[i].system] !== 0 && !inLine(lineK, parts[i]))) continue;
      if (ray.ray.intersectsBox(boxes[i])) cand.push(i);
    }
    let best = null;
    for (const i of cand){
      g.setDrawRange(ranges[i]*3, parts[i].indexCount);
      const h = ray.intersectObject(mesh, false)[0];
      if (h && (!best || h.distance < best.d)) best = { d:h.distance, i };
    }
    g.setDrawRange(0, Infinity);
    const ms = Math.round(performance.now()-t);
    lastPickStat = `${cand.length} boxes · ${ms} ms`;
    if (!best){ if (!isolating()) uSel.value = -1; setPick(null); hudLine(); return; }
    const p = parts[best.i];
    uSel.value = best.i;
    const ln = lineOf(p);
    const sysName = slotLabel(SLOT[p.system]) || p.system;
    const side = p.side === 'l' ? 'left' : p.side === 'r' ? 'right' : '';
    setPick(p.name, [sysName, side, ln.length ? '<span style="color:#8DA2F0">' + ln.join(', ') + '</span>' : ''].filter(Boolean).join(' · '));
    hudLine();
  }

  // --- frame loop with a rolling fps read ---
  let frames = 0, fpsAt = performance.now(), fps = 0;
  (function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene, cam);
    frames++;
    const now = performance.now();
    if (now - fpsAt > 500){ fps = Math.round(frames*1000/(now-fpsAt)); frames = 0; fpsAt = now; hudLine(); }
  })();

  const heap = () => performance.memory ? ' · heap ' + mb(performance.memory.usedJSHeapSize) : '';
  const info = renderer.info;
  let lastPickStat = '';
  function hudLine(){
    hud.textContent =
      `${parts.filter(p=>show[SLOT[p.system]]).length} of ${parts.length} parts shown · ${(ni/3/1000).toFixed(0)}k triangles · ${mb(bytes)} in buffers\n` +
      `${mb(downloaded)} decoded from ${chunks.length} chunks · ready in ${ready}s\n` +
      `${fps} fps · ${info.render.calls} draw call(s) · ${(devicePixelRatio||1).toFixed(1)}x dpr${heap()}` +
      (lastPickStat ? `
last tap: ${lastPickStat}` : '');
  }
  window.__spike = { renderer, scene, cam, mesh, g, parts, ray, pick, place,
    get dist(){return dist}, set dist(v){dist=v; place();},
    bench(n){ // raw render cost, independent of requestAnimationFrame throttling
      const gl = renderer.getContext();
      renderer.render(scene, cam); gl.finish();
      const t = performance.now();
      for (let i=0;i<n;i++) renderer.render(scene, cam);
      gl.finish();
      return { ms: (performance.now()-t)/n, calls: renderer.info.render.calls };
    } };
  const ready = since().replace('s','');
  // After `ready`, because the panel's first paint refreshes the HUD line, which reads it.
  applyLayers();
  hudLine();
  // Loading progress has been on screen until now; from here the numbers live behind the i button.
  const hudBtn = document.getElementById('hudBtn');
  hud.hidden = true; hudBtn.hidden = false;
  hudBtn.onclick = () => { hud.hidden = !hud.hidden; hudBtn.classList.toggle('on', !hud.hidden); };
  setPick(null);
}
main().catch(e => say('FAILED: ' + (e && e.message ? e.message : e)));
</script>
</body>
</html>
